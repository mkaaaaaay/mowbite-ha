name: Release

# the integration as a zip on every release: HACS installs it from there (hacs.json zip_release), and GitHub counts
# how often each release was downloaded
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Zip the integration
        run: cd custom_components/mowbite && zip -r ../../mowbite.zip . -x '__pycache__/*'
      - name: Attach it to the release
        run: gh release upload "${{ github.event.release.tag_name }}" mowbite.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
